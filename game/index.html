<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Solano</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a120e; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #place {
    position: absolute; top: 18px; left: 18px;
    color: #fff6ea; font: 600 13px/1.3 sans-serif; letter-spacing: 0.14em;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  #district { font: 700 22px/1.2 sans-serif; letter-spacing: 0.04em; }
  #heat {
    position: absolute; top: 16px; right: 16px; text-align: right;
    color: #fff6ea; font: 700 14px/1.35 sans-serif;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  }
  #stars { color: #ffc14a; letter-spacing: 0.16em; font-size: 20px; }
  #units { white-space: pre-line; font-weight: 600; color: #d7ecff; }
  #crosshair {
    position: absolute; left: 50%; top: 46%; width: 16px; height: 16px;
    margin: -8px 0 0 -8px; border: 2px solid rgba(255,246,234,0.92); border-radius: 50%;
  }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<canvas id="view" aria-label="Port Solano, an open city. Click to look around, WASD to walk."></canvas>
<div id="hud">
  <div id="place">
    <div id="city-name">PORT SOLANO</div>
    <div id="district">Coral Shore</div>
  </div>
  <div id="heat">
    <div id="stars">CLEAR</div>
    <div id="vitals">HP 100  AR 40  $480</div>
    <div id="arms">Fists</div>
    <div id="units">NO UNITS</div>
  </div>
  <div id="crosshair"></div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
